[project]
name = "musubi-tuner-gui"
version = "0.5.0"
description = "GUI for musubi-tuner"
readme = "README.md"
requires-python = ">=3.10, <3.13"
dependencies = [
    "musubi-tuner[cu128]>=0.3.4",
    "gradio>=5.0.0",
    "tensorboard==2.18.0",
    "tensorflow==2.18.0",
    "tensorflow-io-gcs-filesystem>=0.31.0",
]

[tool.uv.sources]
musubi-tuner = { path = "musubi-tuner" }

[dependency-groups]
dev = [
    "black>=26.5.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
markers = [
    "integration: exercises real musubi-tuner scripts as subprocesses (slower, no GPU required)",
]
