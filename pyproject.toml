[project]
name = "musubi-tuner-gui"
version = "0.2.0"
description = "GUI for musubi-tuner"
readme = "README.md"
requires-python = ">=3.10, <3.13"
dependencies = [
    "musubi-tuner[cu128]>=0.3.4",
    "gradio>=5.0.0",
]

[tool.uv.sources]
musubi-tuner = { path = "musubi-tuner" }

[dependency-groups]
dev = [
    "black>=26.5.1",
]
